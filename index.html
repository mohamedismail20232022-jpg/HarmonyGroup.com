<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #F3A600; 
            --secondary: #333A3F;
            --bg-color: #F8F9FA;
            --white: #FFFFFF;
            --text-dark: #1A1A1A;
            --text-light: #6C757D;
            --border: #E0E0E0;
            --card-bg: #FFFFFF;
            --logo-bg: #FFFFFF; 
            --success: #28A745;
            --danger: #DC3545;
        }

        [data-theme="dark"] {
            --primary: #F3A600;
            --secondary: #E0E0E0;
            --bg-color: #121212;
            --white: #1E1E1E;
            --text-dark: #F8F9FA;
            --text-light: #A0A0A0;
            --border: #333333;
            --card-bg: #1E1E1E;
            --logo-bg: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', 'Quicksand', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-dark); }
        
        header { background: var(--white); box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 1000; display: flex; flex-direction: column; }
        .nav-container { max-width: 100%; margin: 0; padding: 0; display: flex; flex-direction: column; width: 100%; }
        
        /* LOGO BOX - HEIGHT INCREASED AND LOGO RESTORED */
        .logo-box { background: var(--logo-bg); padding: 15px 30px; border-radius: 0; display: flex; align-items: center; justify-content: flex-start; border: none; box-shadow: none; width: 100%; height: 200px; overflow: hidden; position: relative; }
        .logo-img { height: 100%; width: auto; max-width: 100%; object-fit: contain; object-position: right center; cursor: pointer; transition: transform 0.4s ease; display: block; }
        .logo-img:hover { transform: scale(1.03); }

        @media (max-width: 768px) { .logo-box { height: 120px; padding: 10px 15px; } }

        .nav-actions { display: flex; align-items: center; gap: 20px; position: absolute; top: 50%; left: 30px; transform: translateY(-50%); z-index: 1001; }
        .nav-actions button, .theme-toggle { background: none; border: none; font-size: 24px; color: var(--secondary); cursor: pointer; transition: 0.3s; }
        .nav-actions button:hover, .theme-toggle:hover { color: var(--primary); }
        
        .main-layout { max-width: 1400px; margin: 30px auto; display: flex; gap: 30px; padding: 0 20px; flex-wrap: wrap; }
        
        .sidebar { flex: 1; min-width: 280px; background: var(--white); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: fit-content; }
        .filter-group { margin-bottom: 25px; }
        .filter-group h3 { font-size: 16px; margin-bottom: 15px; color: var(--secondary); border-bottom: 2px solid var(--primary); display: inline-block; padding-bottom: 5px; }
        .brand-btn { display: inline-block; padding: 8px 12px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; margin: 5px; cursor: pointer; transition: 0.3s; font-size: 14px; color: var(--text-dark); }
        .brand-btn:hover, .brand-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .price-range { width: 100%; margin-top: 10px; }
        .price-labels { display: flex; justify-content: space-between; font-weight: bold; margin-top: 10px; font-size: 14px; }
        
        select.form-control, .sidebar select { background: var(--white); color: var(--text-dark); border: 1px solid var(--border); }

        .product-grid { flex: 3; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; display: flex; flex-direction: column; cursor: pointer; position: relative; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
        .product-img { width: 100%; height: 250px; object-fit: contain; margin-bottom: 15px; border-radius: 8px; background: transparent; }
        .product-brand { font-size: 12px; color: var(--text-light); text-transform: uppercase; font-weight: bold; }
        .product-title { font-size: 18px; font-weight: bold; color: var(--text-dark); margin: 5px 0; }
        .product-price { font-size: 22px; font-weight: 700; color: var(--primary); margin: 10px 0; }
        .tags { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .tag { font-size: 11px; padding: 4px 8px; border-radius: 4px; background: var(--bg-color); color: var(--secondary); font-weight: bold; border: 1px solid var(--border); }
        .btn-add { background: var(--secondary); color: var(--white); border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: auto; }
        .btn-add:hover { background: var(--primary); color: #000; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 50px; color: var(--text-light); }
        .empty-state i { font-size: 60px; color: var(--border); margin-bottom: 20px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .modal-content { background: var(--white); color: var(--text-dark); width: 100%; max-width: 1000px; max-height: 90vh; overflow-y: auto; border-radius: 16px; display: flex; flex-wrap: wrap; position: relative; border: 1px solid var(--border); }
        .close-modal { position: absolute; top: 15px; left: 20px; font-size: 24px; cursor: pointer; color: var(--text-dark); z-index: 10; }
        .modal-gallery { flex: 1; min-width: 300px; padding: 20px; background: var(--bg-color); text-align: center; }
        .modal-main-img { width: 100%; max-height: 400px; object-fit: contain; }
        .modal-details { flex: 1; min-width: 300px; padding: 30px; }
        .specs-table { width: 100%; border-collapse: collapse; margin-top: 15px; color: var(--text-dark); }
        .specs-table th, .specs-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: right; font-size: 14px; }
        .tax-box, .installment-box { background: var(--bg-color); border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-top: 15px; font-size: 14px; color: var(--text-dark); }
        
        .floating-whatsapp { position: fixed; bottom: 30px; right: 30px; background: #25D366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; text-decoration: none; transition: 0.3s; }
        
        @media (max-width: 768px) { .main-layout { flex-direction: column; } .sidebar { width: 100%; } }

        .nav-icon-wrap { position: relative; display: inline-flex; }
        .cart-badge { position: absolute; top: -8px; left: -10px; background: var(--primary); color: #1A1A1A; font-size: 11px; font-weight: bold; min-width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0 3px; }

        .search-bar-wrap { display: none; width: 100%; padding: 12px 20px; background: var(--white); border-top: 1px solid var(--border); }
        .search-bar-wrap.active { display: flex; gap: 10px; }
        .search-bar-wrap input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-dark); font-size: 15px; }

        .cart-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; z-index: 2100; }
        .cart-overlay.active { display: block; }
        .cart-drawer { position: fixed; top: 0; right: -420px; width: 100%; max-width: 400px; height: 100%; background: var(--white); z-index: 2200; transition: right 0.35s ease; display: flex; flex-direction: column; box-shadow: -4px 0 25px rgba(0,0,0,0.2); }
        .cart-drawer.active { right: 0; }
        .cart-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .cart-header h3 { font-size: 20px; }
        .cart-header .close-cart { font-size: 22px; cursor: pointer; color: var(--text-dark); }
        .cart-items { flex: 1; overflow-y: auto; padding: 15px 20px; }
        .cart-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: center; }
        .cart-item img { width: 60px; height: 60px; object-fit: contain; border-radius: 6px; background: var(--bg-color); }
        .cart-item-info { flex: 1; }
        .cart-item-info h4 { font-size: 14px; margin-bottom: 4px; }
        .cart-item-info .cart-item-price { font-size: 13px; color: var(--primary); font-weight: bold; }
        .qty-controls { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .qty-controls button { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-color); cursor: pointer; color: var(--text-dark); }
        .remove-item { color: var(--danger); cursor: pointer; font-size: 16px; }
        .cart-empty { text-align: center; padding: 60px 20px; color: var(--text-light); }
        .cart-empty i { font-size: 50px; margin-bottom: 15px; display: block; color: var(--border); }
        .cart-footer { padding: 20px; border-top: 1px solid var(--border); }
        .cart-total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .checkout-btn { background: #25D366; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .checkout-btn:hover { background: #1ea952; }

        .toast { position: fixed; bottom: 100px; right: 30px; background: var(--secondary); color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 3000; opacity: 0; transform: translateY(10px); transition: 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateY(0); }

        .loading-state { grid-column: 1 / -1; text-align: center; padding: 60px; color: var(--text-light); }
        .loading-state i { font-size: 40px; margin-bottom: 15px; display: block; }

        .skeleton-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; }
        .skeleton-box { background: linear-gradient(90deg, var(--border) 25%, var(--bg-color) 50%, var(--border) 75%); background-size: 200% 100%; animation: skeleton-shine 1.4s infinite; border-radius: 8px; }
        .skeleton-img { width: 100%; height: 250px; margin-bottom: 15px; }
        .skeleton-line { height: 14px; margin-bottom: 10px; width: 70%; }
        .skeleton-line.short { width: 40%; }
        .skeleton-line.price { height: 22px; width: 50%; margin-top: 4px; }
        .skeleton-btn { height: 42px; width: 100%; margin-top: auto; border-radius: 8px; }
        @keyframes skeleton-shine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .stock-badge { font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; width: fit-content; }
        .stock-badge.in-stock { background: rgba(40,167,69,0.15); color: var(--success); }
        .stock-badge.out-stock { background: rgba(220,53,69,0.15); color: var(--danger); }
        .btn-add:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-add:disabled:hover { background: var(--secondary); color: var(--white); }

        .wishlist-heart { position: absolute; top: 22px; left: 22px; font-size: 20px; color: #fff; background: rgba(0,0,0,0.35); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; transition: 0.2s; }
        .wishlist-heart:hover { transform: scale(1.1); }
        .wishlist-heart.active { color: var(--danger); background: rgba(255,255,255,0.85); }

        .qty-selector { display: flex; align-items: center; gap: 12px; margin: 15px 0; }
        .qty-selector button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-dark); font-size: 16px; cursor: pointer; }
        .qty-selector span { font-size: 18px; font-weight: bold; min-width: 24px; text-align: center; }

        .sort-select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); color: var(--text-dark); font-size: 14px; cursor: pointer; }
        .grid-toolbar { grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-bottom: 5px; }
    </style>
</head>

                    <option value="default">الترتيب الافتراضي</option>
                    <option value="price-asc">السعر: من الأقل للأعلى</option>
                    <option value="price-desc">السعر: من الأعلى للأقل</option>

    <!-- Modal التفاصيل -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content" id="modalContent"></div>

    <!-- Cart Drawer -->
    <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3><i class="fas fa-shopping-cart"></i> عربة التسوق</h3>
            <i class="fas fa-times close-cart" onclick="closeCart()"></i>

    <div class="toast" id="toast"></div>

    <a href="#" class="floating-whatsapp" title="تواصل معنا على واتساب" id="floatingWhatsapp" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i></a>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDErgQEhGlYNtEUwPHY426GNeALbLBDd0M",
            authDomain: "harmonygroup-598ca.firebaseapp.com",
            projectId: "harmonygroup-598ca",
            storageBucket: "harmonygroup-598ca.firebasestorage.app",
            messagingSenderId: "897632559564",
            appId: "1:897632559564:web:d2da2831c0b636a2223d69",
            measurementId: "G-T7TVKNKSP6"
        };

        const WHATSAPP_NUMBER = "201025925739";

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('harmony_theme', newTheme);
            updateThemeIcon(newTheme);
        }
        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        const savedTheme = localStorage.getItem('harmony_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        const productGrid = document.getElementById('productGrid');
        const priceRange = document.getElementById('priceRange');
        const priceVal = document.getElementById('priceVal');
        const brandBtns = document.querySelectorAll('.brand-btn');
        const conditionFilter = document.getElementById('conditionFilter');
        const ramFilter = document.getElementById('ramFilter');
        const storageFilter = document.getElementById('storageFilter');
        const productModal = document.getElementById('productModal');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');

        let currentFilters = { brand: 'all', maxPrice: 200000, condition: 'all', ram: 'all', storage: 'all', search: '' };
        let currentSort = 'default';
        let allProducts = [];
        let modalQty = 1;

        function getWishlist() {
            return JSON.parse(localStorage.getItem('harmony_wishlist') || '[]');
        }
        function toggleWishlist(productId) {
            let wl = getWishlist();
            if (wl.includes(productId)) {
                wl = wl.filter(id => id !== productId);
            } else {
                wl.push(productId);
            }
            localStorage.setItem('harmony_wishlist', JSON.stringify(wl));
            renderProducts();
        }

        function renderSkeleton() {
            productGrid.innerHTML = Array.from({ length: 8 }).map(() => `
                <div class="skeleton-card">
                    <div class="skeleton-box skeleton-img"></div>
                    <div class="skeleton-box skeleton-line short"></div>
                    <div class="skeleton-box skeleton-line"></div>
                    <div class="skeleton-box skeleton-line price"></div>
                    <div class="skeleton-box skeleton-btn"></div>
                </div>
            `).join('');
        }
        renderSkeleton();

        db.collection('products').onSnapshot((snapshot) => {
            allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderProducts();
        }, (error) => {
            console.error('Firestore error:', error);
            productGrid.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-triangle-exclamation"></i>
                    <h2>مفيش اتصال بقاعدة البيانات</h2>
                </div>`;
        });

        function renderProducts() {
            productGrid.innerHTML = '';

            const filtered = allProducts.filter(p => {
                const tax = p.customTax || 0;
                const totalP = Number(p.price) + tax;
                const passBrand = currentFilters.brand === 'all' || p.brand === currentFilters.brand;
                const passPrice = totalP <= currentFilters.maxPrice;
                const passCond = currentFilters.condition === 'all' || p.condition === currentFilters.condition;
                const passRam = currentFilters.ram === 'all' || p.ram === currentFilters.ram;
                const passStorage = currentFilters.storage === 'all' || p.storage === currentFilters.storage;
                const passSearch = !currentFilters.search ||
                    (p.name || '').toLowerCase().includes(currentFilters.search) ||
                    (p.brand || '').toLowerCase().includes(currentFilters.search);
                return passBrand && passPrice && passCond && passRam && passStorage && passSearch;
            });

            if (currentSort === 'price-asc') {
                filtered.sort((a, b) => (Number(a.price) + (a.customTax || 0)) - (Number(b.price) + (b.customTax || 0)));
            } else if (currentSort === 'price-desc') {
                filtered.sort((a, b) => (Number(b.price) + (b.customTax || 0)) - (Number(a.price) + (a.customTax || 0)));
            } else if (currentSort === 'newest') {
                filtered.sort((a, b) => {
                    const aTime = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
                    const bTime = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
                    return bTime - aTime;
                });
            }

            if (allProducts.length === 0) {
                productGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h2>المخزن لسه فاضي يا معلم!</h2>
                    </div>`;
                return;
            }

            if (filtered.length === 0) {
                productGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-magnifying-glass"></i>
                        <h2>مفيش نتايج مطابقة</h2>
                    </div>`;
                return;
            }

            const wishlist = getWishlist();
            filtered.forEach(p => {
                const tax = p.customTax || 0;
                const finalTotal = Number(p.price) + tax;
                const mainImg = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/300x300?text=No+Image';
                const isWished = wishlist.includes(p.id);
                const hasStockField = p.stock !== undefined && p.stock !== null && p.stock !== '';
                const isOutOfStock = hasStockField && Number(p.stock) <= 0;
                const stockBadgeHTML = hasStockField
                    ? (isOutOfStock
                        ? `<span class="stock-badge out-stock"><i class="fas fa-circle-xmark"></i> نفذت الكمية</span>`
                        : `<span class="stock-badge in-stock"><i class="fas fa-circle-check"></i> متوفر</span>`)
                    : '';
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <i class="fa-heart wishlist-heart ${isWished ? 'active fas' : 'far'}" data-id="${p.id}"></i>
                    <img src="${mainImg}" alt="${p.name}" class="product-img">
                    <span class="product-brand">${p.brand}</span>
                    <h3 class="product-title">${p.name}</h3>
                    ${stockBadgeHTML}
                    <div class="tags">
                        <span class="tag"><i class="fas fa-memory"></i> ${p.ram} / ${p.storage}</span>
                        <span class="tag"><i class="fas fa-star"></i> ${p.condition}</span>
                    </div>
                    <div class="product-price">${finalTotal.toLocaleString()} ج.م</div>
                    <button class="btn-add" data-id="${p.id}" ${isOutOfStock ? 'disabled' : ''}>${isOutOfStock ? 'غير متاح حاليًا' : 'أضف للسلة'} <i class="fas fa-cart-plus"></i></button>
                `;
                card.querySelector('.btn-add').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!isOutOfStock) addToCart(p.id);
                });
                card.querySelector('.wishlist-heart').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleWishlist(p.id);
                });
                card.onclick = () => openProductModal(p);
                productGrid.appendChild(card);
            });
        }

        function openProductModal(p) {
            modalQty = 1;
            const tax = p.customTax || 0;
            const finalPrice = Number(p.price) + tax;
            const hasStockField = p.stock !== undefined && p.stock !== null && p.stock !== '';
            const isOutOfStock = hasStockField && Number(p.stock) <= 0;
            const installment = (finalPrice * 1.15) / 12;
            const mainImg = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/300x300';

            let galleryHTML = '';
            if (p.images && p.images.length > 1) {
                galleryHTML = `<div style="display:flex; gap:10px; margin-top:15px; overflow-x:auto; padding-bottom:10px;">` +
                              p.images.map(img => `<img src="${img}" onclick="document.getElementById('mainModalImg').src=this.src" style="width:70px; height:70px; object-fit:cover; border-radius:8px; border:2px solid transparent; cursor:pointer; transition:0.3s;" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='transparent'">`).join('') +
                              `</div>`;
            }

            document.getElementById('modalContent').innerHTML = `
                <i class="fas fa-times close-modal" onclick="closeModal()"></i>
                <div class="modal-gallery">
                    <img src="${mainImg}" id="mainModalImg" class="modal-main-img" alt="${p.name}">
                    ${galleryHTML}
                </div>
                <div class="modal-details">
                    <span style="color:var(--text-light); text-transform:uppercase;">${p.brand}</span>
                    <h2 style="font-size:28px; margin-bottom:10px;">${p.name}</h2>
                    <h3 style="color:var(--primary); font-size:32px; font-weight:bold;">${finalPrice.toLocaleString()} ج.م</h3>

                    <div class="tax-box">
                        <strong><i class="fas fa-info-circle"></i> تفاصيل السعر والضرائب:</strong><br>
                        سعر الجهاز الأساسي: ${Number(p.price).toLocaleString()} ج.م<br>
                        رسوم الجمارك وضرائب NTRA المخصصة: <b>${tax.toLocaleString()} ج.م</b>
                    </div>

                    <div class="installment-box">
                        <strong><i class="fas fa-credit-card"></i> قسط براحتك:</strong><br>
                        12 شهر بقسط شهري يبدأ من <b>${installment.toFixed(0).toLocaleString()} ج.م</b>.
                    </div>

                    <table class="specs-table">
                        <tr><th>الحالة</th><td>${p.condition} ${p.condition === 'New' ? '(متبرشم)' : ''}</td></tr>
                        <tr><th>الرام / المساحة</th><td>${p.ram} / ${p.storage}</td></tr>
                        <tr><th>اللون</th><td style="font-weight:bold;">${p.color || 'مش محدد'}</td></tr>
                        <tr><th>صحة البطارية</th><td style="color:var(--success); font-weight:bold;">${p.battery}%</td></tr>
                        <tr><th>العلبة الأصلية</th><td>${p.box ? '<i class="fas fa-check text-success"></i> موجودة' : '<i class="fas fa-times text-danger"></i> غير موجودة'}</td></tr>
                        <tr><th>الشاحن الأصلي</th><td>${p.charger ? '<i class="fas fa-check text-success"></i> موجود' : '<i class="fas fa-times text-danger"></i> غير موجود'}</td></tr>
                        <tr><th>الوصف الإضافي</th><td style="white-space: pre-wrap; line-height: 1.6;">${p.description || 'مفيش تفاصيل تانية للجهاز ده'}</td></tr>
                    </table>

                    ${isOutOfStock ? '' : `
                    <div class="qty-selector">
                        <button id="modalQtyMinus" type="button"><i class="fas fa-minus"></i></button>
                        <span id="modalQtyVal">1</span>
                        <button id="modalQtyPlus" type="button"><i class="fas fa-plus"></i></button>
                    </div>`}
                    <button class="btn-add" style="margin-top:${isOutOfStock ? '20px' : '0'};" id="modalAddBtn" ${isOutOfStock ? 'disabled' : ''}><i class="fas fa-shopping-cart"></i> ${isOutOfStock ? 'غير متاح حاليًا' : 'أضف للسلة'}</button>
                </div>
            `;
            if (!isOutOfStock) {
                document.getElementById('modalQtyMinus').addEventListener('click', () => {
                    if (modalQty > 1) modalQty--;
                    document.getElementById('modalQtyVal').textContent = modalQty;
                });
                document.getElementById('modalQtyPlus').addEventListener('click', () => {
                    modalQty++;
                    document.getElementById('modalQtyVal').textContent = modalQty;
                });
                document.getElementById('modalAddBtn').addEventListener('click', () => addToCart(p.id, modalQty));
            }
            productModal.style.display = 'flex';
        }

        function closeModal() { productModal.style.display = 'none'; }

        brandBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                brandBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilters.brand = e.target.dataset.brand;
                renderProducts();
            });
        });

        priceRange.addEventListener('input', (e) => {
            currentFilters.maxPrice = e.target.value;
            priceVal.textContent = Number(e.target.value).toLocaleString() + ' ج';
            renderProducts();
        });

        [conditionFilter, ramFilter, storageFilter].forEach(el => {
            el.addEventListener('change', () => {
                currentFilters.condition = conditionFilter.value;
                currentFilters.ram = ramFilter.value;
                currentFilters.storage = storageFilter.value;
                renderProducts();
            });
        });

        function toggleSearch() {
            const wrap = document.getElementById('searchBarWrap');
            wrap.classList.toggle('active');
            if (wrap.classList.contains('active')) searchInput.focus();
        }
        searchInput.addEventListener('input', (e) => {
            currentFilters.search = e.target.value.trim().toLowerCase();
            renderProducts();
        });

        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderProducts();
        });

        function getCart() {
            return JSON.parse(localStorage.getItem('harmony_cart') || '[]');
        }
        function saveCart(cart) {
            localStorage.setItem('harmony_cart', JSON.stringify(cart));
            updateCartBadge();
        }
        function updateCartBadge() {
            const cart = getCart();
            const count = cart.reduce((sum, i) => sum + i.qty, 0);
            const badge = document.getElementById('cartBadge');
            if (count > 0) {
                badge.style.display = 'flex';
                badge.textContent = count;
            } else {
                badge.style.display = 'none';
            }
        }

        function addToCart(productId, qty = 1) {
            const cart = getCart();
            const existing = cart.find(i => i.id === productId);
            if (existing) {
                existing.qty += qty;
            } else {
                cart.push({ id: productId, qty: qty });
            }
            saveCart(cart);
            showToast('تمت الإضافة للعربة');
        }

        function changeQty(productId, delta) {
            const cart = getCart();
            const item = cart.find(i => i.id === productId);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                saveCart(cart.filter(i => i.id !== productId));
            } else {
                saveCart(cart);
            }
            renderCartDrawer();
        }

        function removeFromCart(productId) {
            saveCart(getCart().filter(i => i.id !== productId));
            renderCartDrawer();
        }

        function renderCartDrawer() {
            const cart = getCart();
            const container = document.getElementById('cartItemsContainer');
            const footer = document.getElementById('cartFooter');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <i class="fas fa-cart-shopping"></i>
                        <p>العربة فاضية دلوقتي</p>
                    </div>`;
                footer.innerHTML = '';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map(item => {
                const p = allProducts.find(prod => prod.id === item.id);
                if (!p) return '';
                const tax = p.customTax || 0;
                const unitPrice = Number(p.price) + tax;
                const lineTotal = unitPrice * item.qty;
                total += lineTotal;
                const img = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/100';
                return `
                    <div class="cart-item">
                        <img src="${img}" alt="${p.name}">
                        <div class="cart-item-info">
                            <h4>${p.name}</h4>
                            <div class="cart-item-price">${lineTotal.toLocaleString()} ج.م</div>
                            <div class="qty-controls">
                                <button onclick="changeQty('${p.id}', -1)"><i class="fas fa-minus"></i></button>
                                <span>${item.qty}</span>
                                <button onclick="changeQty('${p.id}', 1)"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                        <i class="fas fa-trash remove-item" onclick="removeFromCart('${p.id}')"></i>
                    </div>`;
            }).join('');

            footer.innerHTML = `
                <div class="cart-total-row"><span>الإجمالي</span><span>${total.toLocaleString()} ج.م</span></div>
                <button class="checkout-btn" onclick="checkoutViaWhatsapp()"><i class="fab fa-whatsapp"></i> إتمام الطلب عبر واتساب</button>
            `;
        }

        function openCart() {
            renderCartDrawer();
            document.getElementById('cartDrawer').classList.add('active');
            document.getElementById('cartOverlay').classList.add('active');
        }
        function closeCart() {
            document.getElementById('cartDrawer').classList.remove('active');
            document.getElementById('cartOverlay').classList.remove('active');
        }

        function checkoutViaWhatsapp() {
            const cart = getCart();
            if (cart.length === 0) return;
            if (!WHATSAPP_NUMBER || WHATSAPP_NUMBER.includes('PASTE_')) {
                showToast('لازم تحط رقم الواتساب في الكود الأول');
                return;
            }
            let message = 'طلب جديد من موقع Harmony GROUP:%0A%0A';
            let total = 0;
            cart.forEach(item => {
                const p = allProducts.find(prod => prod.id === item.id);
                if (!p) return;
                const tax = p.customTax || 0;
                const unitPrice = Number(p.price) + tax;
                const lineTotal = unitPrice * item.qty;
                total += lineTotal;
                let itemColor = p.color ? ` (اللون: ${p.color})` : '';
                message += `- ${p.name}${itemColor} (الكمية: ${item.qty}) — ${lineTotal.toLocaleString()} ج.م%0A`;
            });
            message += `%0Aالإجمالي الكلي: ${total.toLocaleString()} ج.م`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`, '_blank');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        if (WHATSAPP_NUMBER && !WHATSAPP_NUMBER.includes('PASTE_')) {
            document.getElementById('floatingWhatsapp').href = `https://wa.me/${WHATSAPP_NUMBER}`;
        }

        updateCartBadge();
    </script>
</body>
</html>
